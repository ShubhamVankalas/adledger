<!doctype html><html><head><meta charset="utf-8"><title>AdLedger banner</title>
<link rel="stylesheet" href="base.css">
<style>
body { width: 1280px; height: 640px; overflow: hidden; position: relative; }
.copy { position: absolute; left: 68px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 26px; z-index: 3; }
.logo { display: flex; align-items: center; gap: 12px; font: 600 26px var(--sans); letter-spacing: -0.02em; }
h1 { font: 600 62px/1.04 var(--sans); letter-spacing: -0.035em; text-wrap: balance; }
p.sub { font: 400 21px/1.5 var(--sans); color: var(--fg-muted); max-width: 500px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.stage { position: absolute; left: 640px; top: 0; width: 900px; height: 640px; perspective: 1900px; z-index: 2; }
.device { position: absolute; left: 20px; top: 118px; width: 820px; transform: rotateY(-17deg) rotateX(7deg) rotateZ(1.2deg); transform-style: preserve-3d; transform-origin: 0 50%; }
.device .viewport { height: 480px; }
.device .viewport img { width: 820px; left: 0; top: 0; }
.float { position: absolute; z-index: 4; padding: 14px 18px; border-radius: 14px; background: color-mix(in oklch, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  box-shadow: 0 0 0 1px var(--border), 0 20px 50px -10px oklch(0 0 0 / .55); }
body.light .float { box-shadow: 0 0 0 1px var(--border), 0 20px 40px -10px oklch(0.2 0.03 165 / .3); }
.f1 { left: 560px; top: 440px; width: 330px; }
.f1 small { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-faint); }
.f1 .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
.f1 .amt { font: 600 30px var(--mono); letter-spacing: -0.02em; }
.f1 .tag { font: 600 12px var(--sans); color: var(--brand); background: color-mix(in oklch, var(--brand) 14%, transparent); padding: 3px 9px; border-radius: 999px; }
.f1 .line { margin-top: 8px; font: 400 13.5px/1.4 var(--sans); color: var(--fg-muted); }
.f1 .line b { color: var(--fg); font-weight: 500; }
.f2 { left: 1080px; top: 78px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; font: 500 14px var(--sans); color: var(--fg-muted); }
.f2 b { font: 600 18px var(--mono); color: var(--fg); }
</style></head>
<body>
<div class="bgfx"></div>
<div class="copy">
  <div class="logo"><img class="mark" src="../../../public/icon.svg" alt=""> AdLedger</div>
  <h1>Know which ad actually <span class="grad">made you money.</span></h1>
  <p class="sub">Open-source ad attribution, revenue ledger and CRM. Runs on your own server.</p>
  <div class="chips"><span class="chip"><span class="dot"></span>Self-hosted</span><span class="chip">AGPL-3.0</span><span class="chip">Free forever</span></div>
</div>
<div class="stage">
  <div class="device"><div class="frame"><div class="bar"><i></i><i></i><i></i><span>your-adledger.com</span></div>
    <div class="viewport"><img id="shot" src="../../screenshots/overview.png" alt=""></div></div></div>
</div>
<div class="float f1"><small>Ad receipt</small><div class="row"><span class="amt">$614.00</span><span class="tag">Paid back same day</span></div>
  <div class="line">Earned by <b>RSA – Official site</b><br>Cost to acquire <b>$228.13</b></div></div>
<div class="float f2"><span class="dot"></span>ROAS <b>1.68×</b></div>
</body></html>
