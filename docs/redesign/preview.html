    --positive: oklch(0.74 0.15 155); --positive-soft: oklch(0.74 0.15 155 / 0.13);
    --negative: oklch(0.7 0.17 25); --negative-soft: oklch(0.7 0.17 25 / 0.13);
    --warning: oklch(0.8 0.13 75); --warning-soft: oklch(0.8 0.13 75 / 0.14);
    --chart-revenue: oklch(0.74 0.14 160); --chart-spend: oklch(0.68 0.03 250); --chart-leads: oklch(0.8 0.13 75); --chart-customers: oklch(0.7 0.13 268);

  --bg: oklch(0.165 0.004 165); --bg-subtle: oklch(0.145 0.004 165); --surface: oklch(0.195 0.005 165);
  --fill: oklch(0.225 0.005 165); --fill-hover: oklch(0.25 0.006 165); --fill-active: oklch(0.275 0.007 165);
  --border: oklch(1 0 0 / 0.07); --border-strong: oklch(1 0 0 / 0.13);

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/20px var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num, td, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--fg-muted); }
.faint { color: var(--fg-faint); }
kbd { font: 500 11px/16px var(--sans); padding: 0 5px; border-radius: 4px; background: var(--fill); color: var(--fg-muted); box-shadow: inset 0 -1px 0 var(--border-strong); }

/* shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.side { background: var(--bg-subtle); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; overflow-y: auto; }
.ws { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 0; background: none; text-align: left; width: 100%; }
.ws:hover { background: var(--fill-hover); }
.logo { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 11px; color: oklch(0.42 0.11 160); background: oklch(0.93 0.04 160); flex: none; }
.ws b { font-weight: 500; display: block; line-height: 16px; }
.ws small { color: var(--fg-muted); font-size: 12px; }
.search { margin: 6px 0 10px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-faint); width: 100%; text-align: left; }
.search:hover { border-color: var(--border-strong); }
.search span { flex: 1; }
.group { font: 500 11px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--fg-faint); padding: 14px 8px 4px; }
.nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg-muted); border: 0; background: none; width: 100%; text-align: left; transition: background-color .1s, color .1s; }
.nav:hover { background: var(--fill-hover); color: var(--fg); }
.nav[aria-current="page"] { background: var(--fill-active); color: var(--fg); font-weight: 500; }
.nav .i { color: var(--fg-faint); }
.nav[aria-current="page"] .i { color: var(--fg); }
.nav .end { margin-left: auto; font-size: 11px; color: var(--fg-faint); }
.pill-count { margin-left: auto; font: 500 11px/16px var(--sans); padding: 0 6px; border-radius: 99px; background: var(--fill); color: var(--fg-muted); }
.pulse { width: 6px; height: 6px; border-radius: 99px; background: var(--positive); box-shadow: 0 0 0 3px var(--positive-soft); animation: pulse 2s var(--ease-out) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; } }
.side .spacer { flex: 1; min-height: 16px; }
.setup { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 6px; }
.setup b { font-weight: 500; display: block; line-height: 16px; }
.setup small { color: var(--fg-muted); font-size: 12px; }
.user { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; }
.user .av { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: oklch(0.42 0.11 255); background: oklch(0.93 0.04 255); }

main { min-width: 0; overflow-y: auto; }
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.head h1 { font: 600 16px/24px var(--sans); letter-spacing: -0.011em; margin: 0; white-space: nowrap; }
.demo { font: 500 11px/18px var(--sans); padding: 0 8px; border-radius: 99px; color: var(--accent-fg); background: var(--accent-soft); white-space: nowrap; }
.filters { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-weight: 450; white-space: nowrap; transition: background-color .1s, border-color .1s, transform .1s; }
.btn:hover { background: var(--fill); border-color: var(--border-strong); }
.btn:active { transform: scale(.97); }
.btn .i { color: var(--fg-muted); width: 14px; height: 14px; }
.btn.ink { background: var(--ink); color: var(--ink-fg); border-color: transparent; }
.btn.ink .i { color: var(--ink-fg); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--fill-hover); }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--fill); height: 28px; }
.seg button { border: 0; background: none; padding: 0 9px; border-radius: 5px; color: var(--fg-muted); font-weight: 450; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.menu-wrap { position: relative; }
.menu { position: absolute; top: 34px; right: 0; z-index: 20; min-width: 190px; padding: 4px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-lg); transform-origin: top right; animation: pop .15s var(--ease-out); }
.menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; height: 30px; padding: 0 8px; border: 0; border-radius: 5px; background: none; text-align: left; }
.menu button:hover { background: var(--fill-hover); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }

.page { padding: 20px 24px 64px; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.brief { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); font-size: 14px; line-height: 22px; }
.brief .spark { color: var(--accent); }
.brief a { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.brief .up { color: var(--positive); font-weight: 500; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { position: relative; text-align: left; padding: 14px 16px 12px; border-radius: 8px; border: 0; background: var(--surface); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: box-shadow .15s, background-color .15s; }
.kpi:hover { box-shadow: 0 0 0 1px var(--border-strong); }
.kpi[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--accent); }
.kpi .lab { font: 500 12px/16px var(--sans); color: var(--fg-muted); display: flex; align-items: center; gap: 4px; }
.kpi .lab .pin { margin-left: auto; opacity: 0; color: var(--fg-faint); transition: opacity .15s; }
.kpi:hover .pin { opacity: 1; }
.kpi .val { font: 600 24px/32px var(--sans); letter-spacing: -0.02em; white-space: nowrap; }
.kpi .val .unit { font-size: 20px; color: var(--fg-muted); font-weight: 500; margin-left: 1px; }
.kpi .row { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; white-space: nowrap; }
.delta { font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.delta.good { color: var(--positive); } .delta.bad { color: var(--negative); } .delta.flat { color: var(--fg-muted); }
.kpi svg.sp { width: 100%; height: 26px; margin-top: 6px; overflow: visible; }
.target { margin-top: 6px; height: 4px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.target i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

.section { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; gap: 8px; }
.sec-head h2 { font: 500 12px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); margin: 0; }
.sec-head .line { flex: 1; height: 1px; background: var(--border); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-width: 0; position: relative; }
.s-m { grid-column: span 6; } .s-l { grid-column: span 8; } .s-s { grid-column: span 4; } .s-xl { grid-column: span 12; }
.card-h { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 0; }
.card-h h3 { margin: 0; font: 600 14px/20px var(--sans); letter-spacing: -0.006em; }
.card-h p { margin: 0; color: var(--fg-muted); font-size: 12px; line-height: 16px; }
.card-h .end { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.card-b { padding: 12px 16px 16px; }
.bigval { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.bigval b { font: 600 20px/28px var(--sans); letter-spacing: -0.02em; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 2px; border-radius: 2px; display: inline-block; }
.chart { position: relative; height: 260px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; min-width: 170px; padding: 8px 10px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-lg); font-size: 12px; line-height: 18px; transform: translate(-50%, -100%); white-space: nowrap; z-index: 3; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; }

.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border); }
.li:first-child { border-top: 0; }
.li .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.li .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .rt { text-align: right; font-size: 12px; line-height: 16px; }
.li .rt b { font-size: 13px; font-weight: 500; display: block; }
.dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
.bar { height: 4px; border-radius: 99px; background: var(--fill); width: 72px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.tag { font: 500 11px/18px var(--sans); padding: 0 7px; border-radius: 99px; background: var(--fill); color: var(--fg-muted); white-space: nowrap; }
.tag.warn { background: var(--warning-soft); color: oklch(0.5 0.12 65); }
:root[data-theme="dark"] .tag.warn { color: var(--warning); }
.tag.good { background: var(--positive-soft); color: var(--positive); }
.tag.bad { background: var(--negative-soft); color: var(--negative); }

table { width: 100%; border-collapse: collapse; font-size: inherit; line-height: inherit; }
th { font: 500 12px/16px var(--sans); color: var(--fg-muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-subtle); white-space: nowrap; position: sticky; top: 0; }
td { padding: 0 12px; height: 40px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.n, td.n { text-align: right; }
tbody tr { transition: background-color .1s; cursor: pointer; }
tbody tr:hover { background: var(--fill); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.tbl-wrap { overflow-x: auto; border-radius: 12px; box-shadow: var(--shadow-sm); background: var(--surface); }
.person { display: flex; align-items: center; gap: 8px; }
.pav { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none; }
.chk { width: 14px; height: 14px; accent-color: var(--accent); }

.views { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.views button { height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: none; color: var(--fg-muted); font-weight: 450; }
.views button[aria-pressed="true"] { background: var(--fill-active); color: var(--fg); }
.views .cnt { color: var(--fg-faint); margin-left: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; background: var(--surface); box-shadow: var(--shadow-sm); font-size: 12px; }
.chip .x { color: var(--fg-faint); border: 0; background: none; padding: 0; display: inline-flex; }
.bulk { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 10px; background: var(--ink); color: var(--ink-fg); box-shadow: var(--shadow-lg); z-index: 30; animation: rise .2s var(--ease-out); }
.bulk .btn { background: transparent; color: var(--ink-fg); border-color: color-mix(in oklch, var(--ink-fg) 20%, transparent); }
.bulk .btn:hover { background: color-mix(in oklch, var(--ink-fg) 12%, transparent); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

.peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); box-shadow: var(--shadow-lg); z-index: 40; display: flex; flex-direction: column; animation: slide .28s var(--ease-out); overscroll-behavior: contain; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.peek-h { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.peek-b { padding: 16px 20px 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.props { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 13px; }
.props dt { color: var(--fg-muted); } .props dd { margin: 0; }
.tl { display: flex; flex-direction: column; gap: 0; position: relative; }
.tl-i { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; padding-bottom: 16px; position: relative; }
.tl-i::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 1px; background: var(--border); }
.tl-i:last-child::before { display: none; }
.tl-ic { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: var(--fill); color: var(--fg-muted); }
.tl-ic.money { background: var(--positive-soft); color: var(--positive); }
.tl-ic .i { width: 13px; height: 13px; }
.tl-i small { color: var(--fg-muted); font-size: 12px; }

.scrim { position: fixed; inset: 0; background: oklch(0.2 0.01 165 / 0.28); z-index: 35; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.palette { position: fixed; top: 14vh; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 32px)); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 50; overflow: hidden; }
.palette input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 0 16px; font: 400 15px var(--sans); color: var(--fg); outline: none; }
.pal-list { max-height: 360px; overflow-y: auto; padding: 6px; }
.pal-g { font: 500 11px/16px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--fg-faint); padding: 8px 10px 4px; }
.pal-i { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; width: 100%; border: 0; background: none; text-align: left; color: var(--fg); }
.pal-i[aria-selected="true"] { background: var(--fill-active); }
.pal-i .i { color: var(--fg-muted); }
.pal-i kbd { margin-left: auto; }
.pal-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--fg-faint); font-size: 12px; }

    const line = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const ticks = [0, 1, 2, 3, 4].map((k) => `<line x1="${L}" x2="${W - R}" y1="${y(step * k)}" y2="${y(step * k)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(step * k) + 4}" text-anchor="end" font-size="11" fill="var(--fg-faint)">${axisFmt(step * k, m)}</text>`).join('');
    const xl = [0, 7, 14, 21, 29].map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 29 ? 'end' : 'middle'}" font-size="11" fill="var(--fg-faint)">${fmtDate(dates[i])}</text>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.label} per day over the last 30 days">

      ${state.compare ? `<path d="${line(pd)}" fill="none" stroke="var(--fg-faint)" stroke-width="1.25" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>` : ''}
      <path d="${line(data)}" fill="none" stroke="${m.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line id="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--border-strong)" visibility="hidden"/>

    const page = $('#page');
    page.classList.toggle('editing', state.editing && state.view === 'overview');
    page.innerHTML = state.view === 'overview' ? overview() : state.view === 'contacts' ? contacts() : placeholder(TITLES[state.view]);
    if (state.peek) { $('#overlay').innerHTML = peekPanel(state.peek); }
    bindChart();
  }
  function bindChart() {
    const chart = $('#chart'); if (!chart) return;
    const svg = chart.querySelector('svg'), hit = svg.querySelector('[data-hit]'), m = METRICS[state.metric];
    let tip = null;
    const move = (e) => {
      const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
      const px = ((e.clientX - r.left) / r.width) * vb.width;
      const L = 44, iw = vb.width - L - 8, i = Math.max(0, Math.min(DAYS - 1, Math.round(((px - L) / iw) * (DAYS - 1))));
      const x = L + (i / (DAYS - 1)) * iw;
      const max = niceStep(Math.max(...m.data, ...(state.compare ? m.pdata : [])) / 4) * 4;
      const y = 10 + (vb.height - 36) - (m.data[i] / max) * (vb.height - 36);
      const xh = svg.querySelector('#xh'), xd = svg.querySelector('#xd');
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      xd.setAttribute('cx', x); xd.setAttribute('cy', y); xd.setAttribute('visibility', 'visible');
      if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; chart.appendChild(tip); }
      const d = m.pdata[i] ? ((m.data[i] - m.pdata[i]) / m.pdata[i]) * 100 : 0;
      tip.innerHTML = `<div class="muted" style="margin-bottom:4px">${fmtDate(dates[i])}</div><div class="r"><span>This period</span><b class="num">${m.fmt(m.data[i])}</b></div>${state.compare ? `<div class="r"><span class="muted">Previous</span><span class="num muted">${m.fmt(m.pdata[i])}</span></div><div class="r"><span class="muted">Change</span>${deltaHtml(d, m.polarity)}</div>` : ''}`;
      tip.style.left = `${(x / vb.width) * r.width}px`; tip.style.top = `${(y / vb.height) * r.height - 12}px`;
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => { tip?.remove(); tip = null; svg.querySelector('#xh').setAttribute('visibility', 'hidden'); svg.querySelector('#xd').setAttribute('visibility', 'hidden'); });
  }
  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('ql-theme', root.dataset.theme); } catch (e) {}
    render();
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-peek], [data-close], [data-close-pal], input');
    if (!t) { if (state.menu) { state.menu = null; renderFilters(); } return; }
    const d = t.dataset;
    if (d.go) { if (d.go === 'more') { openPalette(); return; } go(d.go); return; }
    if (d.metric) { state.metric = d.metric; render(); return; }
    if (d.model) { state.model = d.model; render(); return; }
    if ('toggleCompare' in d) { state.compare = !state.compare; render(); return; }
    if ('edit' in d) { state.editing = !state.editing; render(); return; }
    if (d.menu) { state.menu = state.menu === d.menu ? null : d.menu; renderFilters(); return; }
    if (d.move) { const [id, dir] = d.move.split(':'); const i = order.indexOf(id), j = i + Number(dir); if (j >= 0 && j < order.length) { [order[i], order[j]] = [order[j], order[i]]; render(); } return; }
    if (d.remove) { order = order.filter((x) => x !== d.remove); render(); return; }
    if ('reset' in d) { order = ['explorer', 'pace', 'campaigns', 'waste', 'platforms', 'recent', 'insight', 'live']; render(); return; }
    if ('add' in d) { const missing = Object.keys(W).filter((k) => !order.includes(k)); if (missing.length) { order.push(missing[0]); render(); } return; }
    if (d.cview) { state.contactView = d.cview; state.selected.clear(); render(); return; }
    if (d.sel !== undefined) { e.stopPropagation(); state.selected.has(d.sel) ? state.selected.delete(d.sel) : state.selected.add(d.sel); render(); return; }
    if ('all' in d) { const boxes = [...document.querySelectorAll('[data-sel]')].map((b) => b.dataset.sel); if (state.selected.size === boxes.length) state.selected.clear(); else boxes.forEach((b) => state.selected.add(b)); render(); return; }
    if ('clear' in d) { state.selected.clear(); render(); return; }
    if ('close' in d) { state.peek = null; closeOverlay(); return; }
    if ('closePal' in d) { closeOverlay(); return; }
    if (d.cmd) { runCmd(d.cmd); return; }
    if ('openPalette' in d) { openPalette(); return; }
    if (t.id === 'theme-toggle') { toggleTheme(); return; }
    if (d.peek) { state.peek = d.peek; $('#overlay').innerHTML = peekPanel(d.peek); return; }
  });
  let seq = '';
  document.addEventListener('keydown', (e) => {
    const pal = $('#pal-in');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal ? closeOverlay() : openPalette(); return; }
    if (pal) {
      const items = [...document.querySelectorAll('.pal-i')];
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach((it, i) => it.setAttribute('aria-selected', i === palSel)); items[palSel]?.scrollIntoView({ block: 'nearest' }); }
      else if (e.key === 'Enter') { e.preventDefault(); items[palSel] && runCmd(items[palSel].dataset.cmd); }
      else if (e.key === 'Escape') closeOverlay();
      return;
    }
    if (e.key === 'Escape') { state.peek = null; state.menu = null; closeOverlay(); renderFilters(); return; }
    if (e.target.closest('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (seq === 'g') { const map = { o: 'overview', p: 'performance', c: 'contacts', d: 'pipeline', v: 'live', a: 'attribution', r: 'customers', i: 'insights' }; seq = ''; if (map[k]) go(map[k]); return; }
    if (k === 'g') { seq = 'g'; setTimeout(() => (seq = ''), 1000); return; }
    if (k === 'e' && state.view === 'overview') { state.editing = !state.editing; render(); }
    if (k === 'x' && state.view === 'overview') { state.compare = !state.compare; render(); }
  });

  // live ticker
  setInterval(() => {
    const n = $('#live-n'); if (!n) return;
    n.textContent = String(Math.max(9, Number(n.textContent) + (rnd() > 0.5 ? 1 : -1)));
    if (rnd() > 0.7) { const f = $('#feed'); if (f) { const div = document.createElement('div'); div.className = 'new-row'; div.innerHTML = `${ic('click')}Ad click · ${rnd() > 0.5 ? 'Meta · Lookalike 1%' : 'Google · Search · Brand'}<span class="t">just now</span>`; f.prepend(div); while (f.children.length > 4) f.lastChild.remove(); } }
  }, 2500);

  render();
})();
</script>
