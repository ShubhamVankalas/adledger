name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (branch protection, pinned
# dependencies, token permissions, ...) and publishes the result for the badge in the README.
# Needs a public repository, so the job skips itself while the repository is private.

on:
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to the Security tab (code scanning).
      security-events: write
      # Publish the results to the OpenSSF API (needed for the badge).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF file for a week
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
