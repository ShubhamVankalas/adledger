name: Website

# Publishes site/ to GitHub Pages (free for public repositories).
# Runs automatically once the repository is public; skipped while it is private.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The site shows the app screenshots from docs/ (one source; site/screenshots is gitignored).
      - name: Use the app screenshots
        run: mkdir -p site/screenshots && cp docs/screenshots/*.png site/screenshots/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
