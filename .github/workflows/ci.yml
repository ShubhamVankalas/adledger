name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pixel (size budget < 5 KB gzipped)
        run: pnpm pixel
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (embedded Postgres, mock connectors)
        run: pnpm test
      - run: pnpm build

  e2e:
    # Browser test of the whole product (setup -> every page -> sign out) on a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results

  postgres:
    # Same suite against a real PostgreSQL 16 server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adledger
          POSTGRES_PASSWORD: adledger
          POSTGRES_DB: adledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adledger" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://adledger:adledger@localhost:5432/adledger_test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/shubhamvankalas/adledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (docker compose up)
        run: |
          ADLEDGER_VERSION=ci docker compose -f docker-compose.yml up -d --no-build
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/v1/health; then echo; break; fi
            sleep 3
          done
          curl -fsS http://localhost:3000/api/v1/health | grep '"db":"ok"'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/setup | grep 200
          curl -fsS http://localhost:3000/p/al.js | head -c 100
          docker compose logs app | tail -20
        env:
          COMPOSE_PROJECT_NAME: adledgerci
      - if: failure()
        run: docker compose logs
        env:
          COMPOSE_PROJECT_NAME: adledgerci
