name: CI

# Every third-party action is pinned to a full commit SHA (the version is in the comment).
# Dependabot keeps the pins fresh. Job names are what branch protection requires
# (see scripts/github/protect-main.sh), so rename them together.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    # Pull requests: block new dependencies with known high-severity advisories or
    # licences that can't ship under FSL-1.1-ALv2 (GPL, AGPL, SSPL, BUSL), and audit the
    # production dependency tree. Both the current and the deprecated SPDX spellings are listed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pixel (size budget < 5 KB gzipped)
        run: pnpm pixel
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (embedded Postgres, mock connectors)
        run: pnpm test
      - run: pnpm build

  e2e:
    # Browser test of the whole product (setup -> every page -> sign out) on a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results

  postgres:
    # Same suite against a real PostgreSQL 16 server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adledger
          POSTGRES_PASSWORD: adledger
          POSTGRES_DB: adledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adledger" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://adledger:adledger@localhost:5432/adledger_test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/shubhamvankalas/adledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (Trivy, fixable high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/shubhamvankalas/adledger:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (docker compose up)
        run: |
          ADLEDGER_VERSION=ci docker compose -f docker-compose.yml up -d --no-build
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/v1/health; then echo; break; fi
            sleep 3
          done
          curl -fsS http://localhost:3000/api/v1/health | grep '"db":"ok"'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/setup | grep 200
          curl -fsS http://localhost:3000/p/al.js | head -c 100
          docker compose logs app | tail -20
        env:
          COMPOSE_PROJECT_NAME: adledgerci
      - if: failure()
        run: docker compose logs
        env:
          COMPOSE_PROJECT_NAME: adledgerci
